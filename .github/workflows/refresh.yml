name: Refresh FPL data

# Keeps the dashboard current between deadline reviews. Pushing to main
# triggers a Vercel redeploy automatically.
on:
  schedule:
    - cron: "17 6,18 * * *"   # twice daily, offset off the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data and page
        run: ./build.sh

      - name: Commit if anything changed
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data.json index.html)" ]]; then
            GW=$(python3 -c "import json;print(json.load(open('data.json'))['gw'])")
            git add data.json index.html
            git commit -m "data: refresh GW${GW} snapshot"
            git push
          else
            echo "No change."
          fi
