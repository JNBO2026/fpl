<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0E13">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Fantasy Premier League squad and the underlying data behind every selection.">
  <title>AI FC Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<style>
:root{
  --bg:#0B0E13; --bg-2:#10141C; --panel:#131822; --card:#1A2029; --card-2:#212836;
  --line:#242C39; --line-soft:#1B212B;
  --ink:#F1F3F7; --ink-2:#A8B0C0; --muted:#6C7488;
  --accent:#D6A34C; --accent-2:#EFC578; --accent-deep:#B3822E; --accent-soft:#241D10;
  --good:#3FAE7E; --good-soft:#0F241C; --good-line:#1C4534;
  --warn:#D6A34C; --warn-soft:#241D10; --warn-line:#4A3A1B;
  --bad:#DB6558; --bad-soft:#271614; --bad-line:#4A2723;
  --r:14px; --r-s:10px;
}
/* Deliberately single-theme: a floodlit-pitch control room at night, painting
   its own ground so it holds regardless of host background. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
.disp{font-family:"League Spartan",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.shell{max-width:520px;margin:0 auto;padding:0 14px}

/* ---------------- header ---------------- */
.top{
  position:sticky;top:0;z-index:40;background:rgba(11,14,19,.90);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
  padding-top:env(safe-area-inset-top);
}
.top-in{display:flex;align-items:center;gap:11px;padding:12px 0}
.mark{
  width:38px;height:38px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);
  display:grid;place-items:center;flex:none;position:relative
}
.mark svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.15;font-family:"League Spartan",sans-serif}
.top .sub{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.freshness{
  margin-left:auto;text-align:right;font-size:9.5px;color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;line-height:1.45;flex:none;white-space:nowrap
}
.top .who{min-width:0;flex:1}
.top h1,.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){ .freshness .lbl{display:none} }
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}

/* ---------------- hero: captain spotlight ---------------- */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r);background:var(--panel);
  border:1px solid var(--line-soft);margin:14px 0;
}
.hero-img{
  position:relative;height:172px;overflow:hidden;background:linear-gradient(160deg,#1B2130,#0B0E13)
}
.hero-crest{
  position:absolute;right:-22px;top:-26px;z-index:1;width:170px;height:170px;
  opacity:.14;filter:grayscale(.15)
}
.hero-photo{
  position:absolute;right:-6px;bottom:-14px;z-index:2;height:206px;width:auto;max-width:none;
  filter:saturate(1.04)
}
.hero-img::after{
  content:"";position:absolute;inset:0;z-index:3;
  background:linear-gradient(100deg,var(--panel) 8%,rgba(19,24,34,.72) 42%,rgba(19,24,34,0) 78%),
             linear-gradient(0deg,var(--panel) 0%,rgba(19,24,34,0) 46%)
}
.hero-tag{
  position:absolute;left:16px;top:14px;z-index:4;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent-2);font-weight:600;display:flex;align-items:center;gap:6px
}
.hero-tag svg{width:12px;height:12px;fill:var(--accent-2)}
.hero-name{position:absolute;left:16px;bottom:14px;z-index:4;right:120px}
.hero-name b{display:block;font-size:26px;line-height:1.02}
.hero-name span{font-size:12px;color:var(--ink-2)}
.hero-body{padding:14px 16px 16px}
.hero .dl{font-size:12.5px;color:var(--ink-2);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.hero .dl b{color:var(--ink);font-weight:600}
.count{display:flex;gap:7px;margin-top:12px}
.cbox{
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--r-s);padding:7px 0;flex:1;text-align:center;min-width:0
}
.cbox b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--accent-2)}
.cbox span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero-foot{
  display:flex;gap:14px;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--line-soft)
}
.hf{flex:1;min-width:0}
.hf span{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.hf b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------------- generic card ---------------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 15px 11px}
.card-h h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.005em;font-family:"League Spartan",sans-serif}
.card-h .tag{
  margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-family:"IBM Plex Mono",monospace
}
.card-note{padding:0 15px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.6}

.sect-h{display:flex;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sect-h h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;font-family:"League Spartan",sans-serif}
.sect-h .c{margin-left:auto;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace}

/* ---------------- player rows ---------------- */
.grp{
  display:flex;align-items:center;gap:8px;padding:8px 15px;background:var(--bg-2);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line-soft)
}
.grp .n{margin-left:auto;letter-spacing:.04em}
.pl{
  display:grid;grid-template-columns:40px 1fr auto;gap:11px;align-items:center;
  padding:11px 15px;border-top:1px solid var(--line-soft);width:100%;text-align:left
}
.pl:first-of-type{border-top:0}
.pl.open{background:var(--bg-2)}
.av-wrap{position:relative;width:40px;height:40px;flex:none}
.av-fallback{
  position:absolute;inset:0;border-radius:10px;background:var(--card-2);display:grid;place-items:center;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);font-family:"IBM Plex Mono",monospace
}
.av-photo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;
  border-radius:10px;background:var(--card-2)
}
.av-crest{
  position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;
  background:var(--bg);padding:2px;box-shadow:0 0 0 2px var(--panel)
}
.pl-m{min-width:0}
.pl-n{font-size:14.5px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:6px}
.pl-n em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-s{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:1px}
.pl-r{text-align:right;flex:none}
.pl-p{font-size:15px;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:-.02em;color:var(--ink)}
.pl-l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.badge{
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;letter-spacing:.07em;
  padding:2px 5px;border-radius:4px;flex:none
}
.b-c{background:var(--accent);color:#191307}
.b-v{background:var(--accent-soft);color:var(--accent-2)}
.b-d{background:var(--warn-soft);color:var(--warn)}
.b-r{background:var(--bad-soft);color:var(--bad)}
.b-n{background:var(--card-2);color:var(--muted)}

/* ---------------- expandable evidence ---------------- */
.ev{display:none;padding:2px 15px 16px;background:var(--bg-2);border-top:1px solid var(--line-soft)}
.ev.show{display:block}
.why{list-style:none;padding:0;margin:10px 0 12px;display:flex;flex-direction:column;gap:8px}
.why li{font-size:13px;color:var(--ink-2);line-height:1.55;padding-left:15px;position:relative}
.why li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.why.empty{font-size:12.5px;color:var(--muted);font-style:normal;padding:2px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:0 0 12px}
.st{background:var(--card);border:1px solid var(--line-soft);border-radius:9px;padding:9px 10px;min-width:0}
.st b{display:block;font-size:15px;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:-.02em}
.st span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.st.hi b{color:var(--accent-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.chip{
  background:var(--card);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--ink-2);
  display:flex;gap:5px;align-items:center
}
.chip i{font-style:normal;color:var(--muted);font-size:10px}
.newsline{
  background:var(--bad-soft);color:#F0A9A0;border:1px solid var(--bad-line);
  border-radius:8px;padding:8px 11px;font-size:12px;margin-bottom:11px
}
.runbar{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.runbar::-webkit-scrollbar{height:0}
.fx{
  flex:none;min-width:54px;border-radius:8px;padding:7px 4px 6px;text-align:center;
  border:1px solid var(--line);background:var(--card)
}
.fx img{width:18px;height:18px;object-fit:contain;margin-bottom:3px}
.fx b{display:block;font-size:10.5px;font-weight:600;letter-spacing:-.005em}
.fx span{display:block;font-size:8.5px;color:var(--muted);letter-spacing:.05em;margin-top:1px}
.fdr1,.fdr2{background:var(--good-soft);border-color:var(--good-line)}
.fdr1 b,.fdr2 b{color:var(--good)}
.fdr3{background:var(--card);border-color:var(--line)}
.fdr4{background:var(--warn-soft);border-color:var(--warn-line)}
.fdr4 b{color:var(--warn)}
.fdr5{background:var(--bad-soft);border-color:var(--bad-line)}
.fdr5 b{color:#F0A9A0}

/* ---------------- glossary ---------------- */
.gloss{list-style:none;margin:0;padding:0 15px 15px;display:flex;flex-direction:column;gap:12px}
.gloss li{font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.gloss b{display:block;color:var(--ink);font-weight:600;font-size:13px;margin-bottom:2px}

/* ---------------- team table ---------------- */
.trow{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;padding:11px 15px;border-top:1px solid var(--line-soft)}
.trow:first-of-type{border-top:0}
.tpos{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.tnm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.tnm img{width:20px;height:20px;object-fit:contain;flex:none}
.tsub{font-size:10.5px;color:var(--muted);margin-top:2px}
.mine{background:var(--accent-soft);color:var(--accent-2);font-size:8.5px;padding:2px 5px;border-radius:4px;font-family:"IBM Plex Mono",monospace;letter-spacing:.05em}
.mini{display:flex;gap:3px}
.mfx{width:16px;height:16px;border-radius:4px;font-size:8.5px;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600}
.m1,.m2{background:var(--good-soft);color:var(--good)}
.m3{background:var(--card-2);color:var(--ink-2)}
.m4{background:var(--warn-soft);color:var(--warn)}
.m5{background:var(--bad-soft);color:#F0A9A0}

/* ---------------- watchlist ---------------- */
.segs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto;padding-bottom:2px}
.segs::-webkit-scrollbar{height:0}
.seg{
  flex:none;padding:8px 15px;border-radius:9px;background:var(--panel);
  border:1px solid var(--line-soft);font-size:13px;color:var(--ink-2);font-weight:600
}
.seg[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#191307}

/* ---------------- decision log ---------------- */
.log{position:relative;padding-left:20px}
.log::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.entry{position:relative;padding-bottom:18px}
.entry::before{
  content:"";position:absolute;left:-19px;top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg)
}
.entry.check::before{background:var(--good)}
.entry.transfer::before{background:var(--warn)}
.e-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.e-h b{font-size:15px;font-weight:700;font-family:"League Spartan",sans-serif}
.e-h time{font-size:10.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.e-s{font-size:13px;color:var(--ink-2);margin:5px 0 8px;line-height:1.55}
.e-ev{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.e-ev li{
  font-size:12.5px;color:var(--muted);line-height:1.5;padding-left:13px;position:relative
}
.e-ev li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--accent-deep)}

/* ---------------- calendar ---------------- */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;padding:0 15px 15px}
.cd{background:var(--card);border:1px solid var(--line-soft);border-radius:9px;padding:8px 9px}
.cd.next{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-deep)}
.cd.h2{opacity:.55}
.cd b{display:block;font-size:9px;letter-spacing:.11em;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.cd span{display:block;font-size:12px;font-weight:500;margin-top:2px;letter-spacing:-.01em}

/* ---------------- views + tabbar ---------------- */
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}

.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(16,20,28,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:2px
}
.tab{
  flex:1;max-width:104px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;border-radius:11px;color:var(--muted);min-height:52px;justify-content:center
}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:9.5px;letter-spacing:.03em;font-weight:600}
.tab[aria-selected="true"]{color:var(--accent-2);background:var(--accent-soft)}

.foot{padding:26px 4px 10px;font-size:11px;color:var(--muted);line-height:1.7;text-align:center}
.foot code{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2)}

/* ---------------- desktop ---------------- */
@media (min-width:900px){
  body{padding-bottom:0}
  .shell{max-width:1120px;padding:0 26px;display:grid;grid-template-columns:206px 1fr;gap:26px;align-items:start}
  .top-in{max-width:1120px;margin:0 auto;padding:14px 26px}
  .tabs{
    position:sticky;top:78px;flex-direction:column;background:none;border:0;backdrop-filter:none;
    padding:14px 0 0;gap:3px;align-self:start
  }
  .tab{flex:none;max-width:none;flex-direction:row;justify-content:flex-start;gap:11px;padding:11px 14px;width:100%}
  .tab span{font-size:13.5px}
  .main{min-width:0}
  .hero{margin-top:14px}
  .hero-img{height:198px}
  .hero-photo{height:236px}
  .hero-crest{width:198px;height:198px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .cal{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
</style>

<div class="top">
  <div class="top-in">
    <div class="mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg></div>
    <div class="who">
      <h1>AI FC</h1>
      <div class="sub" id="subline">Fantasy Premier League</div>
    </div>
    <div class="freshness">
      <div><span class="dot"></span><span class="lbl">Data live</span></div>
      <div id="stamp" class="num"></div>
    </div>
  </div>
</div>

<div class="shell">
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" aria-selected="true" data-v="team">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 10h4M16 10h4M9 5v3h6V5"/></svg><span>Team</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-v="form">
      <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 15l5-5 4 3 7-7"/><path d="M16 6h4v4"/></svg><span>Evidence</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-v="fixtures">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Fixtures</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-v="watch">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Targets</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-v="log">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span>Log</span>
    </button>
  </nav>

  <div class="main">
    <section class="view on" id="v-team"></section>
    <section class="view" id="v-form"></section>
    <section class="view" id="v-fixtures"></section>
    <section class="view" id="v-watch"></section>
    <section class="view" id="v-log"></section>
    <div class="foot" id="foot"></div>

bution","plain":"A newer way to score points for defensive work — tackles, interceptions, blocks, ball recoveries. Hit a threshold in a game (10 for defenders, 12 for midfielders/forwards) and you earn 2 points, even without a goal or clean sheet."},{"term":"Fixture difficulty (FDR)","plain":"A 1–5 rating of how hard a team's next opponent is expected to be — 1–2 is a kind fixture, 4–5 is a tough one. Used to weight the projections toward players facing weaker defences (or weaker attacks, for defenders)."},{"term":"Bonus points","plain":"The top 3 performers in each match, as scored by the official Bonus Points System, get 3, 2 and 1 extra points. Estimated here from a player's BPS rate."},{"term":"Ownership","plain":"The percentage of all Fantasy managers who currently own a player. A high-ownership player who scores big doesn't gain you much rank; a low-ownership player who scores big gains you a lot — and costs you a lot if he doesn't play."},{"term":"Projected points","plain":"This model's estimate of a player's points for the next gameweek, built from all of the above and blended with his actual scoring record. It's an average, so a single week can land well above or below it."},{"term":"Attack and defence form","plain":"How many expected goals a club has created and conceded over its last six gameweeks, against the league average of 100, pulled toward average while the sample is small. Attack 120 means creating 20% more than average. Conceding 80 means allowing 20% less."}],"calendar":[{"gw":1,"deadline":"2026-08-21T17:30:00Z","uk":"Fri 21 Aug · 18:30","fixtures":10,"half":1},{"gw":2,"deadline":"2026-08-28T17:30:00Z","uk":"Fri 28 Aug · 18:30","fixtures":10,"half":1},{"gw":3,"deadline":"2026-09-04T17:30:00Z","uk":"Fri 4 Sep · 18:30","fixtures":10,"half":1},{"gw":4,"deadline":"2026-09-12T12:30:00Z","uk":"Sat 12 Sep · 13:30","fixtures":10,"half":1},{"gw":5,"deadline":"2026-09-18T17:30:00Z","uk":"Fri 18 Sep · 18:30","fixtures":10,"half":1},{"gw":6,"deadline":"2026-10-10T10:00:00Z","uk":"Sat 10 Oct · 11:00","fixtures":10,"half":1},{"gw":7,"deadline":"2026-10-17T10:00:00Z","uk":"Sat 17 Oct · 11:00","fixtures":10,"half":1},{"gw":8,"deadline":"2026-10-23T17:30:00Z","uk":"Fri 23 Oct · 18:30","fixtures":10,"half":1},{"gw":9,"deadline":"2026-10-31T11:00:00Z","uk":"Sat 31 Oct · 11:00","fixtures":10,"half":1},{"gw":10,"deadline":"2026-11-06T18:30:00Z","uk":"Fri 6 Nov · 18:30","fixtures":10,"half":1},{"gw":11,"deadline":"2026-11-21T11:00:00Z","uk":"Sat 21 Nov · 11:00","fixtures":10,"half":1},{"gw":12,"deadline":"2026-11-27T18:30:00Z","uk":"Fri 27 Nov · 18:30","fixtures":10,"half":1},{"gw":13,"deadline":"2026-12-01T18:30:00Z","uk":"Tue 1 Dec · 18:30","fixtures":10,"half":1},{"gw":14,"deadline":"2026-12-05T11:00:00Z","uk":"Sat 5 Dec · 11:00","fixtures":10,"half":1},{"gw":15,"deadline":"2026-12-12T13:30:00Z","uk":"Sat 12 Dec · 13:30","fixtures":10,"half":1},{"gw":16,"deadline":"2026-12-19T11:00:00Z","uk":"Sat 19 Dec · 11:00","fixtures":10,"half":1},{"gw":17,"deadline":"2026-12-26T11:00:00Z","uk":"Sat 26 Dec · 11:00","fixtures":10,"half":1},{"gw":18,"deadline":"2026-12-29T18:00:00Z","uk":"Tue 29 Dec · 18:00","fixtures":10,"half":1},{"gw":19,"deadline":"2027-01-01T18:30:00Z","uk":"Fri 1 Jan · 18:30","fixtures":10,"half":1},{"gw":20,"deadline":"2027-01-05T18:00:00Z","uk":"Tue 5 Jan · 18:00","fixtures":10,"half":2},{"gw":21,"deadline":"2027-01-16T13:30:00Z","uk":"Sat 16 Jan · 13:30","fixtures":10,"half":2},{"gw":22,"deadline":"2027-01-23T13:30:00Z","uk":"Sat 23 Jan · 13:30","fixtures":10,"half":2},{"gw":23,"deadline":"2027-01-30T13:30:00Z","uk":"Sat 30 Jan · 13:30","fixtures":10,"half":2},{"gw":24,"deadline":"2027-02-06T13:30:00Z","uk":"Sat 6 Feb · 13:30","fixtures":10,"half":2},{"gw":25,"deadline":"2027-02-10T18:30:00Z","uk":"Wed 10 Feb · 18:30","fixtures":10,"half":2},{"gw":26,"deadline":"2027-02-20T13:30:00Z","uk":"Sat 20 Feb · 13:30","fixtures":10,"half":2},{"gw":27,"deadline":"2027-02-27T13:30:00Z","uk":"Sat 27 Feb · 13:30","fixtures":10,"half":2},{"gw":28,"deadline":"2027-03-03T18:30:00Z","uk":"Wed 3 Mar · 18:30","fixtures":10,"half":2},{"gw":29,"deadline":"2027-03-13T13:30:00Z","uk":"Sat 13 Mar · 13:30","fixtures":10,"half":2},{"gw":30,"deadline":"2027-03-20T13:30:00Z","uk":"Sat 20 Mar · 13:30","fixtures":10,"half":2},{"gw":31,"deadline":"2027-04-10T12:30:00Z","uk":"Sat 10 Apr · 13:30","fixtures":10,"half":2},{"gw":32,"deadline":"2027-04-17T12:30:00Z","uk":"Sat 17 Apr · 13:30","fixtures":10,"half":2},{"gw":33,"deadline":"2027-04-24T12:30:00Z","uk":"Sat 24 Apr · 13:30","fixtures":10,"half":2},{"gw":34,"deadline":"2027-05-01T12:30:00Z","uk":"Sat 1 May · 13:30","fixtures":10,"half":2},{"gw":35,"deadline":"2027-05-08T12:30:00Z","uk":"Sat 8 May · 13:30","fixtures":10,"half":2},{"gw":36,"deadline":"2027-05-15T12:30:00Z","uk":"Sat 15 May · 13:30","fixtures":10,"half":2},{"gw":37,"deadline":"2027-05-23T12:30:00Z","uk":"Sun 23 May · 13:30","fixtures":10,"half":2},{"gw":38,"deadline":"2027-05-30T13:30:00Z","uk":"Sun 30 May · 14:30","fixtures":10,"half":2}]};</script>
<script>
(function(){
  "use strict";
  const D = window.FPL;
  const $ = (s,r)=> (r||document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const initials = n => n.replace(/[^A-Za-zÀ-ÿ' ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const ORDER = {GK:0,DEF:1,MID:2,FWD:3};
  const LONG = {GK:"Goalkeeper",DEF:"Defenders",MID:"Midfielders",FWD:"Forwards"};

  /* ---------- shared fragments ---------- */
  function avatar(p){
    return `<div class="av-wrap">
      <div class="av-fallback">${esc(initials(p.full || p.name))}</div>
      ${p.photo ? `<img class="av-photo" src="${p.photo}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      ${p.crest ? `<img class="av-crest" src="${p.crest}" alt="" loading="lazy" onerror="this.remove()">` : ""}
    </div>`;
  }
  function runBar(run, big){
    if(!run || !run.length) return "";
    const crestFor = opp => { const t = (D.table||[]).find(x=>x.team===opp); return t ? t.crest : ""; };
    return '<div class="runbar">' + run.map(f => {
      const c = crestFor(f.opp);
      return `<div class="fx fdr${f.fdr}">${c?`<img src="${c}" alt="" loading="lazy" onerror="this.remove()">`:""}<b>${esc(f.opp)}</b><span>${f.home?"H":"A"} · GW${f.gw}</span></div>`;
    }).join("") + "</div>";
  }
  function miniRun(run){
    return '<div class="mini">' + run.slice(0,6).map(f =>
      `<div class="mfx m${f.fdr}" title="GW${f.gw} ${f.home?"vs":"at"} ${esc(f.opp)} — difficulty ${f.fdr}">${f.fdr}</div>`
    ).join("") + "</div>";
  }
  function flags(p){
    let out = "";
    if(p.captain) out += '<span class="badge b-c">C</span>';
    if(p.vice) out += '<span class="badge b-v">V</span>';
    if(p.status === "d") out += '<span class="badge b-d">DOUBT</span>';
    if(p.status === "i" || p.status === "u") out += '<span class="badge b-r">OUT</span>';
    return out;
  }
  function playerRow(p){
    return `<button class="pl" data-p="${p.id}" aria-expanded="false">
      ${avatar(p)}
      <div class="pl-m">
        <div class="pl-n"><em>${esc(p.name)}</em>${flags(p)}</div>
        <div class="pl-s"><span>${esc(p.team)}</span><span>£${p.price.toFixed(1)}m</span><span>${p.own.toFixed(1)}% owned</span></div>
      </div>
      <div class="pl-r"><div class="pl-p">${p.projNext.toFixed(1)}</div><div class="pl-l">GW${D.gw} proj</div></div>
    </button>
    <div class="ev">${evidence(p)}</div>`;
  }
  function evidence(p){
    const isKeeper = p.pos === "GK";
    const cells = isKeeper
      ? [["Clean sheet chance",p.csp+"%",true],["Assists expected /90",p.xa90,false],["Minutes played this season",p.mins.toLocaleString(),false],["Points scored this season",p.pts,false]]
      : [["Goals expected /90",p.xg90,p.xg90>=0.3],["Assists expected /90",p.xa90,p.xa90>=0.2],
         ["Defensive-bonus chance",p.dcp+"%",p.dcp>=50],["Clean sheet chance",p.csp+"%",p.csp>=40]];

    let html = "";
    if(p.why && p.why.length){
      html += '<ul class="why">' + p.why.map(w=>`<li>${esc(w)}</li>`).join("") + "</ul>";
    } else {
      html += '<div class="why empty">No standout factors either way — a fairly average projection for the position.</div>';
    }

    html += '<div class="stats">' + cells.map(c =>
      `<div class="st${c[2]?" hi":""}"><b>${esc(String(c[1]))}</b><span>${esc(c[0])}</span></div>`).join("") + "</div>";

    const m = [];
    m.push(`<span class="chip"><i>Next ${D.horizon} gameweeks</i>${p.projH} pts</span>`);
    m.push(`<span class="chip"><i>Points per £m</i>${p.ppm}</span>`);
    if(p.pen) m.push(`<span class="chip"><i>Penalty order</i>#${p.pen}</span>`);
    if(p.sp) m.push(`<span class="chip"><i>Set-piece order</i>#${p.sp}</span>`);
    if(p.netT) m.push(`<span class="chip"><i>Net transfers this week</i>${p.netT>0?"+":""}${p.netT.toLocaleString()}</span>`);
    html += '<div class="meta">' + m.join("") + "</div>";

    if(p.news) html += `<div class="newsline">${esc(p.news)}</div>`;
    html += runBar(p.run || (D.table.find(t=>t.team===p.team)||{}).run);
    return html;
  }
  function group(list){
    const by = {};
    list.forEach(p => (by[p.pos] = by[p.pos] || []).push(p));
    return Object.keys(by).sort((a,b)=>ORDER[a]-ORDER[b]).map(pos => {
      const g = by[pos].sort((a,b)=> b.projNext - a.projNext);
      const tot = g.reduce((s,p)=>s+p.projNext,0);
      return `<div class="grp"><span>${LONG[pos]}</span><span class="n">${tot.toFixed(1)} pts proj</span></div>`
        + g.map(playerRow).join("");
    }).join("");
  }

  /* ---------- views ---------- */
  function vTeam(){
    const cap = D.squad.find(p => p.captain) || D.squad[0];
    const benchList = D.bench.map((p,i) =>
      `<button class="pl" data-p="${p.id}" aria-expanded="false">
        ${avatar(p)}
        <div class="pl-m">
          <div class="pl-n"><em>${esc(p.name)}</em>${flags(p)}<span class="badge b-n">${p.pos}</span></div>
          <div class="pl-s"><span>${esc(p.team)}</span><span>£${p.price.toFixed(1)}m</span><span>sub ${i+1}</span></div>
        </div>
        <div class="pl-r"><div class="pl-p">${p.projNext.toFixed(1)}</div><div class="pl-l">GW${D.gw} proj</div></div>
      </button><div class="ev">${evidence(p)}</div>`).join("");

    return `
    <div class="hero">
      <div class="hero-img">
        <div class="hero-tag"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.6 2.4 7.4L12 16.8 5.8 21.4l2.4-7.4L2 9.4h7.6z"/></svg>Captain, GW${D.teamGw}</div>
        ${cap.crest ? `<img class="hero-crest" src="${cap.crest}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        ${cap.photo ? `<img class="hero-photo" src="${cap.photo}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        <div class="hero-name"><b class="disp">${esc(cap.name)}</b><span>${esc(cap.team)} · ${cap.projNext.toFixed(1)} pts projected for GW${D.gw}, doubled on the armband</span></div>
      </div>
      <div class="hero-body">
        <div class="dl">Team as locked in for GW${D.teamGw}. New moves appear after each deadline.</div>
        <div class="dl">Gameweek ${D.gw} deadline <b>${esc(D.deadlineUK)}</b></div>
        <div class="count" id="count">
          <div class="cbox"><b class="num" data-c="d">–</b><span>days</span></div>
          <div class="cbox"><b class="num" data-c="h">–</b><span>hrs</span></div>
          <div class="cbox"><b class="num" data-c="m">–</b><span>min</span></div>
          <div class="cbox"><b class="num" data-c="s">–</b><span>sec</span></div>
        </div>
        <div class="hero-foot">
          <div class="hf"><span>Shape</span><b>${esc(D.shape)}</b></div>
          <div class="hf"><span>Captain</span><b>${esc(D.captain)}</b></div>
          <div class="hf"><span>GW${D.gw} XI proj</span><b>${D.xiProj} pts</b></div>
          <div class="hf"><span>Value</span><b>£${D.squadValue}m</b></div>
        </div>
      </div>
    </div>

    <div class="sect-h"><h2>Starting XI</h2><span class="c">tap a player for the reasoning</span></div>
    <div class="card">${group(D.xi)}</div>

    <div class="sect-h"><h2>Bench</h2><span class="c">in substitution order</span></div>
    <div class="card">${benchList}</div>`;
  }

  function vForm(){
    const all = D.squad.slice().sort((a,b)=> b.projNext - a.projNext);
    const risky = all.filter(p => p.own < 5);
    const gloss = (D.glossary||[]).map(g => `<li><b>${esc(g.term)}</b>${esc(g.plain)}</li>`).join("");
    return `
    <div class="sect-h"><h2>The evidence</h2><span class="c">${all.length} players</span></div>
    <div class="card">
      <div class="card-h"><h3>What these terms mean</h3></div>
      <ul class="gloss">${gloss}</ul>
    </div>

    <div class="card">
      <div class="card-h"><h3>How the projection is built</h3></div>
      <div class="card-note">
        Expected goals and assists per 90, a clean-sheet probability from expected goals conceded,
        and the odds of clearing the defensive-contribution threshold — combined under the real
        scoring rules, then scaled by expected minutes, availability and the fixture. The fixture
        adjustment is half official difficulty and half each opponent's recent expected goals,
        with a small boost at home.
        <br><br>
        Based on this season only (${D.gwPlayed} gameweek${D.gwPlayed===1?"":"s"} played).
        Players with few minutes are pulled toward a typical starter until the evidence builds up.
        The number on each player is for the next match. Tap a player for the next ${D.horizon} gameweeks.
      </div>
    </div>

    <div class="sect-h"><h2>Squad, ranked</h2><span class="c">by projected points</span></div>
    <div class="card">${all.map(playerRow).join("")}</div>

    ${risky.length ? `<div class="sect-h"><h2>Low-ownership picks</h2><span class="c">under 5% owned</span></div>
    <div class="card">
      <div class="card-note" style="padding-top:14px">
        These are where the model disagrees most with the crowd. Each one is here because of a
        specific number — usually a defensive-contribution rate the market hasn't priced. They are
        also the first things to re-check if the team underperforms.
      </div>
      ${risky.map(playerRow).join("")}
    </div>` : ""}`;
  }

  function vFixtures(){
    const rows = D.table.map((t,i) => `
      <div class="trow">
        <div class="tpos">${i+1}</div>
        <div>
          <div class="tnm">${t.crest?`<img src="${t.crest}" alt="" loading="lazy" onerror="this.remove()">`:""}${esc(t.name)}${t.owned.length?`<span class="mine">${t.owned.length} owned</span>`:""}</div>
          <div class="tsub">${t.owned.length ? esc(t.owned.join(", ")) : "no players owned"}${t.form?` · last ${t.form.played}: ${t.form.gf} scored, ${t.form.ga} conceded per game`:""} · attack ${t.attForm}, conceding ${t.defForm}</div>
        </div>
        <div style="text-align:right">
          ${miniRun(t.run)}
          <div class="pl-l" style="margin-top:4px">avg ${t.fdr}</div>
        </div>
      </div>`).join("");

    const cal = D.calendar.map(c => {
      const isNext = c.gw === D.gw;
      const cls = isNext ? "cd next" : (c.half === 2 ? "cd h2" : "cd");
      return `<div class="${cls}"><b>GW${c.gw}${c.fixtures!==10?` · ${c.fixtures} FIX`:""}</b><span>${esc(c.uk)}</span></div>`;
    }).join("");

    return `
    <div class="sect-h"><h2>Fixture difficulty</h2><span class="c">next ${D.horizon} gameweeks</span></div>
    <div class="card">
      <div class="card-note" style="padding-top:14px">
        Sorted easiest run first. The coloured squares are the official difficulty ratings for each
        of the next ${D.horizon} matches — green is kind, red is not.
      </div>
      ${rows}
    </div>

    <div class="sect-h"><h2>Every deadline</h2><span class="c">all 38</span></div>
    <div class="card">
      <div class="card-note" style="padding-top:14px">
        Deadlines are not weekly on a fixed day — Fridays, Saturdays at two different times, five
        midweek Wednesdays, and two Sundays to close. Faded entries are the second chip half
        (gameweeks 20–38). A gameweek showing anything other than 10 fixtures is a blank or a double.
      </div>
      <div class="cal">${cal}</div>
    </div>`;
  }

  function vWatch(){
    const worst = {};
    D.squad.forEach(p => { if(!worst[p.pos] || p.projH < worst[p.pos].projH) worst[p.pos] = p; });
    const segs = ["DEF","MID","FWD","GK"];
    const panels = segs.map((pos,i) => {
      const w = worst[pos];
      const list = (D.watch[pos]||[]).map(p => {
        const delta = w ? (p.projH - w.projH) : 0;
        const good = delta >= 1.5;
        return `<button class="pl" data-p="${p.id}" aria-expanded="false">
          ${avatar(p)}
          <div class="pl-m">
            <div class="pl-n"><em>${esc(p.name)}</em>${p.own<5?'<span class="badge b-n">DIFF</span>':""}</div>
            <div class="pl-s"><span>${esc(p.team)}</span><span>£${p.price.toFixed(1)}m</span><span>${p.own.toFixed(1)}%</span></div>
          </div>
          <div class="pl-r">
            <div class="pl-p" style="color:${good?"var(--good)":"var(--ink-2)"}">${delta>0?"+":""}${delta.toFixed(1)}</div>
            <div class="pl-l">vs ${esc(w?w.name:"–")}</div>
          </div>
        </button><div class="ev">${evidence(p)}</div>`;
      }).join("");
      return `<div class="wpanel" data-pos="${pos}" ${i?'hidden':''}>
        <div class="card">
          <div class="card-note" style="padding-top:14px">
            Gain is measured over ${D.horizon} gameweeks against <strong>${esc(w?w.name:"–")}</strong>,
            the weakest ${pos} in the squad. The bar for using a free transfer is
            <strong>+1.5</strong>; for taking a −4 hit it is <strong>+6</strong>.
          </div>
          ${list || '<div class="card-note">Nothing qualifying right now.</div>'}
        </div>
      </div>`;
    }).join("");

    return `
    <div class="sect-h"><h2>Transfer targets</h2><span class="c">not currently owned</span></div>
    <div class="segs" role="tablist">${segs.map((p,i)=>
      `<button class="seg" role="tab" aria-selected="${i===0}" data-seg="${p}">${LONG[p]}</button>`).join("")}</div>
    ${panels}`;
  }

  function vLog(){
    const entries = (D.log||[]).map(e => `
      <div class="entry ${esc(e.kind||"")}">
        <div class="e-h"><b>${esc(e.title)}</b><time>GW${e.gw} · ${esc(e.date)}</time></div>
        <div class="e-s">${esc(e.summary)}</div>
        <ul class="e-ev">${(e.evidence||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div>`).join("");
    return `
    <div class="sect-h"><h2>Decision log</h2><span class="c">${(D.log||[]).length} entries</span></div>
    <div class="card">
      <div class="card-note" style="padding-top:14px">
        Every change to the team, and the evidence behind it where it was written down.
        Transfers are added automatically from FPL once a deadline passes.
      </div>
      <div style="padding:4px 15px 15px"><div class="log">${entries}</div></div>
    </div>`;
  }

  /* ---------- wiring ---------- */
  $("#v-team").innerHTML = vTeam();
  $("#v-form").innerHTML = vForm();
  $("#v-fixtures").innerHTML = vFixtures();
  $("#v-watch").innerHTML = vWatch();
  $("#v-log").innerHTML = vLog();
  $("#subline").textContent = "Gameweek " + D.gw + " · " + D.shape + " · £" + D.squadValue + "m";
  $("#stamp").textContent = D.stamp || D.generatedUK;
  $("#foot").innerHTML = "Built from the official Fantasy Premier League API · snapshot <code>"
    + esc(D.generated) + "</code><br>Projections are estimates. Football is not.";

  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + t.dataset.v));
    window.scrollTo({top:0, behavior:"instant"});
    try{ localStorage.setItem("fpl.tab", t.dataset.v); }catch(e){}
  }));

  document.addEventListener("click", e => {
    const seg = e.target.closest(".seg");
    if(seg){
      seg.parentElement.querySelectorAll(".seg").forEach(s => s.setAttribute("aria-selected", s === seg));
      document.querySelectorAll(".wpanel").forEach(p => p.hidden = p.dataset.pos !== seg.dataset.seg);
      return;
    }
    const row = e.target.closest(".pl");
    if(!row) return;
    const ev = row.nextElementSibling;
    if(!ev || !ev.classList.contains("ev")) return;
    const open = ev.classList.toggle("show");
    row.classList.toggle("open", open);
    row.setAttribute("aria-expanded", open);
  });

  try{
    const saved = localStorage.getItem("fpl.tab");
    if(saved){ const t = document.querySelector('.tab[data-v="'+saved+'"]'); if(t) t.click(); }
  }catch(e){}

  const target = new Date(D.deadline).getTime();
  const boxes = {};
  document.querySelectorAll("#count [data-c]").forEach(b => boxes[b.dataset.c] = b);
  function tick(){
    let s = Math.floor((target - Date.now())/1000);
    if(s <= 0){
      const c = document.getElementById("count");
      if(c) c.innerHTML = '<div class="cbox" style="flex:1"><b>Deadline passed</b><span>gameweek under way</span></div>';
      return;
    }
    const d = Math.floor(s/86400); s -= d*86400;
    const h = Math.floor(s/3600);  s -= h*3600;
    const m = Math.floor(s/60);    s -= m*60;
    if(boxes.d) boxes.d.textContent = d;
    if(boxes.h) boxes.h.textContent = String(h).padStart(2,"0");
    if(boxes.m) boxes.m.textContent = String(m).padStart(2,"0");
    if(boxes.s) boxes.s.textContent = String(s).padStart(2,"0");
    setTimeout(tick, 1000);
  }
  tick();
})();
</script>
</body>
</html>
